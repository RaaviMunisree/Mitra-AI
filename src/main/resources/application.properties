spring.application.name=Mitra AI Backend

spring.datasource.url=jdbc:mysql://localhost:3306/mitra_ai
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:1.5b-instruct
# Geoapify Places API
mitra.external.geoapify.base-url=https://api.geoapify.com
mitra.external.geoapify.api-key=${GEOAPIFY_API_KEY}

# Duffel Flights and Stays API
mitra.external.duffel.base-url=https://api.duffel.com
mitra.external.duffel.api-token=${DUFFEL_API_TOKEN}

# Ollama Embeddings
spring.ai.ollama.embedding.model=nomic-embed-text

# Qdrant Vector Database
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=mitra_knowledge
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.use-tls=false

# RAG original document storage
mitra.rag.storage.location=./data/rag-documents
